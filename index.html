<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hand Hopscotch Fun Brain Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
      body { margin: 0; padding: 0; background: black; overflow: hidden; }

      #start-screen {
        position: absolute;
        z-index: 9999;
        width: 100vw;
        height: 100vh;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #start-screen button {
        padding: 20px 40px;
        font-size: 24px;
        background-color: #1e90ff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }

      #rotate-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        z-index: 9998;
        justify-content: center;
        align-items: center;
      }

      #rotate-screen img {
        width: 50%;
        max-width: 300px;
      }
    </style>
  </head>

  <body>
    <!-- Экран запуска -->
    <div id="start-screen">
      <button onclick="startGame()">▶️ Запустить игру</button>
    </div>

    <!-- Unity -->
    <div id="unity-container" class="unity-mobile" style="display: none;">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Hand Hopscotch Fun Brain Game</div>
      </div>
    </div>

    <!-- Поворот экрана -->
    <div id="rotate-screen">
      <img src="Restart.png" alt="Поверните устройство">
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      function checkOrientation() {
        let rotateScreen = document.getElementById("rotate-screen");
        if (window.innerHeight > window.innerWidth) {
          rotateScreen.style.display = "flex";
        } else {
          rotateScreen.style.display = "none";
        }
      }

      window.addEventListener("resize", checkOrientation);
      document.addEventListener("DOMContentLoaded", checkOrientation);

      let audioContext;

      function unlockAudio() {
        if (audioContext) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = audioContext.createBuffer(1, 1, 22050);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
        console.log("🔊 Audio unlocked on iOS");
      }

      function startGame() {
        unlockAudio();

        document.getElementById("start-screen").style.display = "none";
        document.getElementById("unity-container").style.display = "block";

        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const fullscreenButton = document.querySelector("#unity-fullscreen-button");

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/Hopscotch_WebGL.loader.js";
        const config = {
          dataUrl: buildUrl + "/Hopscotch_WebGL.data",
          frameworkUrl: buildUrl + "/Hopscotch_WebGL.framework.js",
          codeUrl: buildUrl + "/Hopscotch_WebGL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "ZNOVANNA",
          productName: "Hand Hopscotch Fun Brain Game",
          productVersion: "1.0.2",
          showBanner: unityShowBanner,
        };

        canvas.style.background = "url('" + buildUrl + "/Hopscotch_WebGL.jpg') center / cover";
        loadingBar.style.display = "block";

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            alert(message);
          });
        };

        document.body.appendChild(script);
      }

      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        const div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
    </script>
  </body>
</html>
