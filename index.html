<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hand Hopscotch Fun Brain Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div class="jsmpeg"></div>
    <div id="start-button-container" style="position: absolute; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999;">
      <button id="start-button" style="padding: 20px 40px; font-size: 24px; border: none; border-radius: 8px; background: #1e90ff; color: white; cursor: pointer;">
        Start
      </button>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Hand Hopscotch Fun Brain Game</div>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <div id="rotate-screen">
      <img src="Restart.png" alt="Поверните устройство">
    </div>

    <style>
      #rotate-screen {
        display: none; /* Изначально скрыто */
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
    
      #rotate-screen img {
        width: 50%;
        max-width: 300px;
      }
    </style>

  <script>
    function checkOrientation() {
      let rotateScreen = document.getElementById("rotate-screen");
      if (window.innerHeight > window.innerWidth) {
        rotateScreen.style.display = "flex"; // Показываем экран
      } else {
        rotateScreen.style.display = "none"; // Скрываем экран
      }
    }

    window.addEventListener("resize", checkOrientation);
    document.addEventListener("DOMContentLoaded", checkOrientation);
  </script>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    var startButton = document.getElementById("start-button");
    var startContainer = document.getElementById("start-button-container");

    document.body.addEventListener('touchstart', function(){
      player.audioOut.unlock(function(){
        alert('unlocked!');
      });
    });

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Hopscotch_WebGL.loader.js";
    var config = {
      dataUrl: buildUrl + "/Hopscotch_WebGL.data",
      frameworkUrl: buildUrl + "/Hopscotch_WebGL.framework.js",
      codeUrl: buildUrl + "/Hopscotch_WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ZNOVANNA",
      productName: "Hand Hopscotch Fun Brain Game",
      productVersion: "1.0.2",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    canvas.style.background = "url('" + buildUrl + "/Hopscotch_WebGL.jpg') center / cover";

    function startUnity() {
      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
      startContainer.style.display = "none";
    }

    startButton.addEventListener("click", startUnity);
  </script>
  </body>
</html>
